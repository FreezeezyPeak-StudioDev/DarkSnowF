<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créditos - DarkSnowF</title>
  <link rel="icon" href="../assets/Texturas/Logos/DarkSnowF.png" type="image/png">
  <link rel="stylesheet" href="../src/css/main.css">
  <link rel="stylesheet" href="../src/css/themes.css">
  <style>
    body {
      background: linear-gradient(180deg, #080c15 0%, #070b12 45%, #05070a 100%);
      color: #e8eef8;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
    }
    .brand-logo {
      max-width: 320px;
      width: 100%;
      height: auto;
      object-fit: contain;
      margin-bottom: 24px;
    }
    .dev-by {
      font-size: 1rem;
      color: #8fa2c8;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0 0 8px 0;
    }
    .dev-name {
      font-size: 2.2rem;
      color: #0066B2;
      letter-spacing: 2px;
      margin: 0 0 24px 0;
      font-weight: 700;
    }
    .credit-links {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .credit-links a {
      padding: 8px 16px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e8eef8;
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .credit-links a:hover {
      background: rgba(0, 51, 102, 0.2);
      border-color: #0066B2;
      transform: translateY(-2px);
    }
    .credit-tech {
      font-size: 0.8rem;
      color: #8fa2c8;
      letter-spacing: 2px;
      margin: 0 0 6px 0;
    }
    .credit-copy {
      font-size: 0.8rem;
      color: #8fa2c8;
      margin: 0 0 28px 0;
    }
    h1 {
      font-size: 2.5rem;
      color: #0066B2;
      margin: 0 0 32px 0;
    }
    .back-btn {
      display: inline-block;
      padding: 10px 20px;
      background: rgba(0, 51, 102, 0.15);
      border: 1px solid #0066B2;
      border-radius: 8px;
      color: #0066B2;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background: rgba(0, 51, 102, 0.25);
      transform: translateY(-2px);
    }
  </style>
  <link rel="stylesheet" href="../src/css/cursor.css">
  <link rel="stylesheet" href="../src/css/menu.css">
  <link rel="stylesheet" href="../src/css/modals.css">
  <link rel="stylesheet" href="../src/css/dialogs.css">
</head>
<body>
  <div class="container">
    <img src="../assets/Texturas/Logos/logo_freezeezy peak_HD.png" alt="Logo de Freezeezy Peak" class="brand-logo">
    <p class="dev-by" data-pi18n="devBy">Desarrollado por</p>
    <p class="dev-name">Freezeezy Peak</p>
    <div class="credit-links">
      <a href="https://www.youtube.com/@FreezeezyPeak" target="_blank" rel="noopener">YouTube</a>
      <a href="https://github.com/FreezeezyPeak-StudioDev" target="_blank" rel="noopener">GitHub</a>
      <a href="https://addons.mozilla.org/es-ES/firefox/user/20170408/" target="_blank" rel="noopener">Firefox Add-ons</a>
      <a href="https://gitlab.com/freezeezypeak.studiodev" target="_blank" rel="noopener">GitLab</a>
      <a href="#" data-coming-soon="itch">itch.io</a>
      <a href="#" data-coming-soon="web">Mi web</a>
    </div>
    <p class="credit-tech">HTML • CSS • JavaScript</p>
    <p class="credit-copy">© 2026 Freezeezy Peak</p>
    <a href="../Index.html" class="back-btn" data-pi18n="backBtn">← Volver a inicio</a>
  </div>
  <script src="../src/js/i18n-pages.js"></script>
  <script src="../src/js/rotate.js"></script>
  <script src="../src/js/cat-remote.js"></script>
  <script src="../src/js/profile-cfg.js"></script>
  <script src="../src/js/config-loader.js"></script>
  <script src="../src/js/snow.js"></script>
  <script src="../src/js/modals.js"></script>
  <script src="../src/js/menu.js"></script>
</body>
</html>
