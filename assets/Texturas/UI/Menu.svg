<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Menú hamburguesa grande y bien espaciado -->
  <!-- Línea superior -->
  <line x1="15" y1="25" x2="85" y2="25"
        stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
  <line x1="15" y1="25" x2="85" y2="25"
        stroke="white" stroke-width="6.5" stroke-linecap="round"/>
  
  <!-- Línea central -->
  <line x1="15" y1="50" x2="85" y2="50"
        stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
  <line x1="15" y1="50" x2="85" y2="50"
        stroke="white" stroke-width="6.5" stroke-linecap="round"/>
  
  <!-- Línea inferior -->
  <line x1="15" y1="75" x2="85" y2="75"
        stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
  <line x1="15" y1="75" x2="85" y2="75"
        stroke="white" stroke-width="6.5" stroke-linecap="round"/>
</svg>
