<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Símbolo de prohibición/deshabilitado grande y centrado -->
  <!-- Círculo exterior -->
  <circle cx="50" cy="50" r="38" fill="white" stroke="#1a1a1a" stroke-width="6"/>
  
  <!-- Línea diagonal de prohibición (más ancha y visible) -->
