<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Lápiz grande y detallado -->
  <!-- Cuerpo del lápiz (hexagonal) -->
  <path d="M72 12 L88 28 L40 76 L24 72 L28 60 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Zona de madera del lápiz -->
  <path d="M68 16 L84 32 L80 36 L64 20 Z"
        fill="#1a1a1a" opacity="0.2"/>
  
  <!-- Punta del lápiz (grafito) -->
  <path d="M72 12 L88 28 L80 36 L64 20 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M76 16 L84 24 L80 28 L72 20 Z"
        fill="#1a1a1a"/>
  
  <!-- Marca de escritura (trazo que dibuja) -->
  <path d="M40 76 L22 88 L18 84 L24 72 Z"
        fill="#1a1a1a" opacity="0.4"/>
  <circle cx="20" cy="86" r="3" fill="#1a1a1a"/>
  
  <!-- Detalles del cuerpo (líneas de separación) -->
  <line x1="50" y1="44" x2="64" y2="58" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="56" y1="38" x2="70" y2="52" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Goma de borrar (parte trasera) -->
  <ellipse cx="27" cy="63" rx="8" ry="6"
           transform="rotate(-45 27 63)"
           fill="#1a1a1a" opacity="0.7"/>
  <ellipse cx="27" cy="63" rx="8" ry="6"
           transform="rotate(-45 27 63)"
           fill="none" stroke="#1a1a1a" stroke-width="3"/>
</svg>
