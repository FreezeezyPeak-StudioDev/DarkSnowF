<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Pergamino/documento enrollado más grande -->
  <!-- Cuerpo del documento -->
  <rect x="20" y="20" width="60" height="60" rx="3" ry="3"
        fill="white" stroke="#1a1a1a" stroke-width="5"/>
  
  <!-- Enrollados superiores (izquierda y derecha) -->
  <path d="M20 26 Q20 15 28 15 Q36 15 36 26"
        fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="28" cy="18" r="2.5" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  
  <path d="M64 26 Q64 15 72 15 Q80 15 80 26"
        fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="72" cy="18" r="2.5" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Enrollados inferiores -->
  <path d="M20 74 Q20 85 28 85 Q36 85 36 74"
        fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="28" cy="82" r="2.5" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  
  <path d="M64 74 Q64 85 72 85 Q80 85 80 74"
        fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="72" cy="82" r="2.5" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Líneas de texto (más visibles) -->
  <line x1="30" y1="38" x2="70" y2="38" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="48" x2="70" y2="48" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="58" x2="70" y2="58" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="68" x2="60" y2="68" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
</svg>
