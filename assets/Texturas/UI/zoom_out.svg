<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Lupa con - (mismo estilo que zoom_in) -->
  <!-- Círculo de la lupa -->
  <circle cx="38" cy="38" r="28" fill="white" stroke="#1a1a1a" stroke-width="6"/>
  
  <!-- Reflejo de luz en el cristal (detalle) -->
  <path d="M24 24 Q28 20 34 22" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Signo "−" dentro (línea horizontal) -->
  <line x1="24" y1="38" x2="52" y2="38"
        stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Mango de la lupa -->
  <line x1="58" y1="58" x2="88" y2="88"
        stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
  <line x1="58" y1="58" x2="88" y2="88"
        stroke="white" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Punta del mango (detalle) -->
  <circle cx="88" cy="88" r="6" fill="#1a1a1a"/>
</svg>
