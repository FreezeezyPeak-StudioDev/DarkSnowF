<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Papelera abierta más grande y centrada -->
  <!-- Cuerpo de la papelera -->
  <path d="M25 40 L30 88 L70 88 L75 40 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Líneas verticales internas (detalle de basura) -->
  <line x1="40" y1="48" x2="38" y2="80" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="48" x2="50" y2="80" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="48" x2="62" y2="80" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Borde superior (anillo) -->
  <rect x="20" y="34" width="60" height="7" rx="3" ry="3"
        fill="white" stroke="#1a1a1a" stroke-width="5"/>
  
  <!-- Asa central superior -->
  <path d="M38 34 L38 28 Q50 24 62 28 L62 34"
        fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 34 L38 28 Q50 24 62 28 L62 34"
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Tapa levantada (inclinada hacia la derecha) -->
  <path d="M45 34 L65 15 L80 23 L60 42 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Asa de la tapa -->
  <ellipse cx="72" cy="19" rx="8" ry="4" 
           fill="white" stroke="#1a1a1a" stroke-width="3.5"/>
</svg>
