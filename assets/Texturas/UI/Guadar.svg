<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Disquete más grande y detallado -->
  <!-- Cuerpo principal del disquete -->
  <rect x="10" y="10" width="80" height="80" rx="6" ry="6"
        fill="white" stroke="#1a1a1a" stroke-width="5.5"/>
  
  <!-- Esquina cortada (superior derecha) -->
  <path d="M68 10 L90 32 L90 10 Z" fill="#1a1a1a"/>
  <path d="M68 10 L90 32" fill="none" stroke="#1a1a1a" stroke-width="5.5" stroke-linecap="square"/>
  
  <!-- Etiqueta superior oscura (área magnética) -->
  <rect x="18" y="10" width="40" height="32" rx="3"
        fill="#1a1a1a"/>
  
  <!-- Ventana/ranura del disquete (metal) -->
  <rect x="32" y="16" width="20" height="20" rx="2"
        fill="white" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Líneas de detalle en la ventana -->
  <line x1="36" y1="22" x2="48" y2="22" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="36" y1="26" x2="48" y2="26" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="36" y1="30" x2="48" y2="30" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- Área inferior (etiqueta de escritura) -->
  <rect x="16" y="56" width="68" height="24" rx="4"
        fill="white" stroke="#1a1a1a" stroke-width="3.5"/>
  
  <!-- Líneas en la etiqueta -->
  <line x1="22" y1="64" x2="78" y2="64" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="71" x2="65" y2="71" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Protección de escritura (cuadrito inferior derecho) -->
  <rect x="72" y="62" width="8" height="14" rx="1"
        fill="#1a1a1a"/>
</svg>
