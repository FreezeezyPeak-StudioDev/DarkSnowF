<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Bote de pintura más grande y detallado -->
  <!-- Cuerpo del bote (trapezoide) -->
  <path d="M22 40 L28 82 L72 82 L78 40 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Nivel de pintura dentro del bote -->
  <path d="M26 55 L30 82 L70 82 L74 55 Z"
        fill="#1a1a1a" opacity="0.15"/>
  <line x1="26" y1="55" x2="74" y2="55" stroke="#1a1a1a" stroke-width="2.5"/>
  
  <!-- Borde superior del bote -->
  <rect x="18" y="34" width="64" height="8" rx="4"
        fill="white" stroke="#1a1a1a" stroke-width="5"/>
  
  <!-- Asa del bote -->
  <path d="M32 34 L32 24 Q50 17 68 24 L68 34"
        fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 34 L32 24 Q50 17 68 24 L68 34"
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Brocha saliendo del bote -->
  <line x1="58" y1="34" x2="80" y2="12"
        stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  <line x1="58" y1="34" x2="80" y2="12"
        stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Cabeza de la brocha -->
  <rect x="72" y="6" width="16" height="9" rx="2"
        transform="rotate(-45 80 10)"
        fill="white" stroke="#1a1a1a" stroke-width="4"/>
  
  <!-- Cerdas de la brocha -->
  <line x1="76" y1="8" x2="79" y2="11" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="79" y1="5" x2="82" y2="8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="82" y1="2" x2="85" y2="5" stroke="#1a1a1a" stroke-width="1.5"/>
</svg>
