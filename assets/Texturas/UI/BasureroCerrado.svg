<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Papelera cerrada más grande y centrada -->
  <!-- Cuerpo principal -->
  <path d="M25 40 L30 88 L70 88 L75 40 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Líneas verticales internas -->
  <line x1="40" y1="48" x2="38" y2="80" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="48" x2="50" y2="80" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="48" x2="62" y2="80" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tapa plana cerrada -->
  <rect x="18" y="32" width="64" height="9" rx="4" ry="4"
        fill="white" stroke="#1a1a1a" stroke-width="5"/>
  
  <!-- Asa arqueada sobre la tapa -->
  <path d="M38 32 L38 22 Q50 16 62 22 L62 32"
        fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 32 L38 22 Q50 16 62 22 L62 32"
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
