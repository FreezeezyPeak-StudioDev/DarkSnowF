<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="src/css/dialogs.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 240px;
      background: #0a0f19;
      color: #e8eef8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 500;
    }
    .popup-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .popup-head img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .popup-head strong {
      font-size: 0.95rem;
      color: #0066B2;
    }
    .popup-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hidden { display: none !important; }
    .p-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e8eef8;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      text-decoration: none;
    }
    .p-btn:hover {
      background: rgba(0, 51, 102, 0.2);
      border-color: #0066B2;
    }
    .p-row {
      display: flex;
      gap: 8px;
    }
    .p-row .p-btn {
      justify-content: center;
      padding: 9px 6px;
    }
    .p-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .p-section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: #9aa7c4;
      margin: 2px 0 0 0;
    }
    .p-section-label img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }
    .p-pf {
      justify-content: flex-start;
    }
    .p-pf.active {
      border-color: #0066B2;
      background: rgba(0, 51, 102, 0.2);
    }
    .p-pf-row {
      display: flex;
      gap: 6px;
      align-items: stretch;
    }
    .p-pf-row .p-pf {
      flex: 1;
    }
    .p-mini {
      width: 26px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e8eef8;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .p-mini:hover {
      background: rgba(0, 51, 102, 0.3);
      border-color: #0066B2;
    }
    .p-mini img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      pointer-events: none;
    }
    .p-inline-input {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid #0066B2;
      border-radius: 8px;
      padding: 7px 10px;
      color: #e8eef8;
      font-size: 0.82rem;
      outline: none;
      font-family: inherit;
    }
    .p-btn.off {
      border-color: rgba(120, 130, 150, 0.5);
      color: #9aa7c4;
    }
    .p-btn.off svg { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="popup-head">
    <img src="assets/Texturas/Logos/DarkSnowF.png" alt="DarkSnowF">
    <strong>DarkSnowF</strong>
  </div>

  <div class="popup-body" data-view-main>
    <button class="p-btn" data-go-profiles>
      <img src="assets/Texturas/UI/Usuario.svg" alt="" style="width: 18px; height: 18px; object-fit: contain;">
      <span data-pl="profiles">Perfiles</span>
    </button>
    <button class="p-btn" data-go-redes>      <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2.4" fill="#0066B2"/><circle cx="12" cy="12" r="2.4" fill="#0066B2"/><circle cx="18" cy="12" r="2.4" fill="#0066B2"/></svg>
      <span data-pl="networks">Redes</span>
    </button>
    <button class="p-btn" data-open-license>
      <svg viewBox="0 0 24 24" fill="none" stroke="#9aa7c4" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>
      <span data-pl="license">Licencia</span>
    </button>
    <button class="p-btn" data-open-credits>
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#9aa7c4" stroke-width="2"/><path d="M12 8v5M12 16v.5" stroke="#9aa7c4" stroke-width="2"/></svg>
      <span data-pl="credits">Créditos</span>
    </button>
    <button class="p-btn" data-new-window title="Nueva ventana">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9aa7c4" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16"/></svg>
      <span data-pl="newWindow">Nueva ventana</span>
    </button>
  </div>

  <div class="popup-body hidden" data-view-profiles>
    <button class="p-btn" data-go-main2>
      <svg viewBox="0 0 24 24" fill="none" stroke="#9aa7c4" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      <span data-pl="back">Atrás</span>
    </button>
    <div data-pf-manage></div>
    <button class="p-btn" data-pf-create>
      <svg viewBox="0 0 24 24" fill="none" stroke="#e8eef8" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      <span data-pl="pfCreateBtn">Crear perfil</span>
    </button>
  </div>

  <div class="popup-body hidden" data-view-redes>
    <button class="p-btn" data-go-main>
      <svg viewBox="0 0 24 24" fill="none" stroke="#9aa7c4" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      <span data-pl="back">Atrás</span>
    </button>
    <a class="p-btn" href="https://www.youtube.com/@FreezeezyPeak" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="4" fill="#FF0000"/><path d="M10 9.5v5l4.5-2.5L10 9.5z" fill="#fff"/></svg>
      <span>YouTube</span>
    </a>
    <a class="p-btn" href="https://github.com/FreezeezyPeak-StudioDev" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#e8eef8"><path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.54 2.87 8.39 6.84 9.75.5.1.68-.22.68-.49 0-.24-.01-1.04-.02-1.89-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.58 2.36 1.12 2.93.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.3.1-2.72 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.46.1 2.72.64.72 1.03 1.64 1.03 2.76 0 3.94-2.34 4.81-4.57 5.07.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.6.69.49A10.2 10.2 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/></svg>
      <span>GitHub</span>
    </a>
    <a class="p-btn" href="https://addons.mozilla.org/es-ES/firefox/user/20170408/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#FF7139"/><path d="M12 2a10 10 0 0 0-3.9.8c2.5.6 3.4 2.4 3.1 4.3-.3 2.1-2 3.4-2.3 5.5-.3 2.3 1.2 4.6 3.1 5.9a10 10 0 0 0 0-16.5z" fill="#FFBD4F"/><circle cx="12" cy="12" r="4.5" fill="#0060DF"/></svg>
      <span>Firefox Add-ons</span>
    </a>
    <a class="p-btn" href="https://gitlab.com/freezeezypeak.studiodev" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none"><polygon points="12,2 15,8 20,6 21,13 18,19 12,22 6,19 3,13 4,6 9,8" fill="#FC6D26"/><polygon points="12,9 15,12 12,17 9,12" fill="#fff"/></svg>
      <span>GitLab</span>
    </a>
    <a class="p-btn" href="#" data-coming-soon="itch">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="11" rx="4" fill="#FA5C5C"/><circle cx="9" cy="12.5" r="1.6" fill="#fff"/><circle cx="15" cy="12.5" r="1.6" fill="#fff"/></svg>
      <span>itch.io</span>
    </a>
    <a class="p-btn" href="#" data-coming-soon="web">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#2E9BD6"/><ellipse cx="12" cy="12" rx="4" ry="9" stroke="#fff" stroke-width="1.6" fill="none"/><line x1="3.5" y1="12" x2="20.5" y2="12" stroke="#fff" stroke-width="1.6"/></svg>
      <span>Mi web</span>
    </a>
  </div>

  <script src="utils/dialogs.js"></script>
  <script src="src/js/profile-cfg.js"></script>
  <script src="src/js/popup.js"></script>
</body>
</html>
